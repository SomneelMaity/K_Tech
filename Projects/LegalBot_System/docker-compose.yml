version: "3.9"

services:
  backend:
    build: ./platform/backend
    ports:
      - "8000:8000"
    env_file:
      - ./platform/backend/.env
    volumes:
      - ./platform/backend/storage:/app/storage
    depends_on: []

  frontend:
    build: ./platform/frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
