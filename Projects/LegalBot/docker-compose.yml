version: '3.8'

services:
  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: legalbot-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@db:5432/legalbot}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_API_BASE=${LLM_API_BASE}
      - BHASHINI_API_KEY=${BHASHINI_API_KEY}
      - ENVIRONMENT=development
    volumes:
      - ./backend:/app
      - ./knowledge-base:/app/knowledge-base
      - vector-store:/app/vector_store
    depends_on:
      - db
      - redis
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: legalbot-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NODE_ENV=development
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    command: npm run dev

  # PostgreSQL Database (optional, for user sessions/analytics)
  db:
    image: postgres:15-alpine
    container_name: legalbot-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=legalbot
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis (for caching, rate limiting)
  redis:
    image: redis:7-alpine
    container_name: legalbot-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # pgAdmin (optional, for DB management)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: legalbot-pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@legalbot.local
      - PGADMIN_DEFAULT_PASSWORD=admin
    ports:
      - "5050:80"
    depends_on:
      - db
    profiles:
      - tools

volumes:
  postgres-data:
  redis-data:
  vector-store:

networks:
  default:
    name: legalbot-network
